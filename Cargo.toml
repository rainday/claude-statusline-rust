[package]
name = "claude-statusline-rs"
version = "0.2.0"
edition = "2021"
description = "A custom statusline for Claude Code with segment-based architecture and Morandi color palette"
license = "MIT"
repository = "https://github.com/rainday/claude-statusline-rust"
homepage = "https://github.com/rainday/claude-statusline-rust"
keywords = ["claude", "statusline", "cli", "developer-tools"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
ureq = { version = "2.10", features = ["json"] }
chrono = "0.4"
dirs = "5.0"
